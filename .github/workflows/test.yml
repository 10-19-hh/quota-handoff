# First recorded run: 12/12 jobs succeeded on commit b1789d0 (see docs/RELEASE_CHECKLIST.md).
# Every commit to be released needs its own green run on all matrix entries.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Record file-system case sensitivity
        run: |
          python - <<'EOF'
          import os, tempfile
          base = os.environ["RUNNER_TEMP"]
          probe = os.path.join(base, "CaseProbe")
          open(probe, "w").close()
          result = "case-insensitive" if os.path.exists(os.path.join(base, "caseprobe")) else "case-sensitive"
          os.remove(probe)
          line = f"- {os.environ['MATRIX_OS']} / Python {os.environ['MATRIX_PY']}: RUNNER_TEMP is **{result}**"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          EOF
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PY: ${{ matrix.python }}

      - name: Unit and integration tests (incl. output-conflict and symlink tests)
        run: python -m unittest discover -s tests -t . -v

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist-ci
          ls -l dist-ci

      - name: Check sdist contents
        run: |
          python - <<'EOF'
          import glob, sys, tarfile
          names = tarfile.open(glob.glob("dist-ci/*.tar.gz")[0]).getnames()
          required = ["examples/usage-sample.json", "examples/task-sample.json", "docs/SECURITY.md",
                      "docs/REASON_CODES.md", "LICENSE", "tests/test_cli.py"]
          missing = [r for r in required if not any(n.endswith("/" + r) for n in names)]
          bad = [n for n in names if "__pycache__" in n or n.endswith((".pyc", ".pyo"))]
          print(f"{len(names)} members; missing={missing}; unexpected={bad}")
          sys.exit(1 if missing or bad else 0)
          EOF

      - name: Install wheel in a clean venv and run the entry point outside the checkout
        run: |
          python -m venv ../venv-ci
          if [ -x ../venv-ci/bin/python ]; then BIN="$(cd ../venv-ci/bin && pwd)"; else BIN="$(cd ../venv-ci/Scripts && pwd)"; fi
          WHEEL="$(ls dist-ci/*.whl)"
          "$BIN/python" -m pip install "$WHEEL"
          mkdir -p ../elsewhere && cd ../elsewhere
          "$BIN/quota-handoff" --version
          "$BIN/quota-handoff" status --demo
          "$BIN/quota-handoff" plan --demo --task code --prefer codex
          printf '{"schema_version": "0.2", "objective": "CI smoke test"}' > task.json
          "$BIN/quota-handoff" handoff create --input task.json --output handoff.md
          echo "QH_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Run checkout-only README commands with the installed entry point
        run: |
          "$QH_BIN/quota-handoff" plan --fixture examples/usage-sample.json --now 2026-11-18T09:02:00+09:00
          "$QH_BIN/quota-handoff" handoff create --input examples/task-sample.json --output ../handoff-ci.md

[build-system]
# setuptools >= 77 is required for the PEP 639 `license` (SPDX) and `license-files` fields.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-handoff"
version = "0.1.2.dev0"
description = "Local-first, read-only CLI that normalizes coding-agent usage snapshots, explains a deterministic recommendation, and renders a manual handoff document."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
quota-handoff = "quota_handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
